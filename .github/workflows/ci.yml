name: CI

on:
  push:
    branches: [main, codex/release-desktop-v0.1.0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-tests:
    name: Source tests / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Build sdist and wheel
        run: python -m build

  windows-package:
    name: Build and smoke-test Windows portable package
    runs-on: windows-latest
    needs: source-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create build environment
        run: python -m venv .venv
      - name: Install build and test dependencies
        run: .venv\Scripts\python.exe -m pip install -e ".[dev]"
      - name: Build and verify executable metadata
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Verify smoke and exact engine inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path ./dist/StatGuardDesktop.exe).Path
          $smoke = (Join-Path (Resolve-Path ./build).Path "ci-smoke.json")
          $enginePath = (Join-Path (Resolve-Path ./build).Path "ci-engine.json")
          $process = Start-Process -FilePath $exe -ArgumentList @("--smoke-test", $smoke) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE smoke test failed." }
          $process = Start-Process -FilePath $exe -ArgumentList @("--engine-info", $enginePath) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Engine info failed." }
          $engine = Get-Content -Raw $enginePath | ConvertFrom-Json
          $expected = @("ML001", "ML002", "ML003", "ML004", "ML005", "ML006", "ML007", "ML008", "ML009", "ST001", "ST002")
          if (($engine.enabled_rule_ids -join ",") -cne ($expected -join ",")) { throw "Unexpected rule inventory." }
          $source = Join-Path (Resolve-Path ./build).Path "ci-no-execution.py"
          $marker = Join-Path (Resolve-Path ./build).Path "ci-must-not-exist.txt"
          Set-Content -LiteralPath $source -Value "from pathlib import Path`nPath('$marker').write_text('executed')"
          $report = Join-Path (Resolve-Path ./build).Path "ci-no-execution.json"
          $process = Start-Process -FilePath $exe -ArgumentList @("--scan-smoke", $source, $report) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "No-execution scan failed." }
          if (Test-Path -LiteralPath $marker) { throw "Scanner executed submitted Python." }
      - name: Package portable ZIP and run extracted-artifact checks
        shell: pwsh
        run: ./scripts/package_portable_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: statguard-desktop-v0.1.0-windows-x64-ci
          path: |
            dist/StatGuardDesktop.exe
            release/StatGuard-Desktop-0.1.0-windows-x64.zip
            release/StatGuard-Desktop-0.1.0-windows-x64.zip.sha256
          if-no-files-found: error
